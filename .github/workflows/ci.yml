name: CI

on: [push, pull_request]

jobs:
  test:
    name: Unit tests + public evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run public evaluator (smoke)
        run: python -X utf8 -m evaluator.local_evaluator --output /tmp/ci_results.json

      - name: Run catalog-disjoint paraphrase benchmark (smoke)
        run: >-
          python -X utf8 -m scripts.shadow_evaluator
          --sample-count 20
          --seed 42
          --output /tmp/ci_shadow_results.json
